name: Build iPANTAU APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to create the GitHub release on tag pushes

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Pin Java 17. Newer runner images default to Java 25, which the
      # Gradle 8.14 Kotlin DSL cannot parse ("What went wrong: 25.0.5").
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze code
        run: |
          set +e
          flutter analyze --no-pub > analyze.txt 2>&1
          code=$?
          cat analyze.txt
          # Surface each issue as a GitHub annotation (visible in the PR/checks UI)
          grep -E '^ *(error|warning|info) [^ ]+ ' analyze.txt | head -50 \
            | sed -E 's/^ *(error|warning|info) [^ ]+ (.*) [^ ]+ ([^ ]+):([0-9]+):([0-9]+) [^ ]+ ([a-z_0-9]+)$/::\1 file=\3,line=\4,col=\5::\6: \2/' \
            | sed -E 's/^::info /::notice /'
          exit $code

      - name: Run tests
        run: flutter test --no-pub

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: iPANTAU-apk-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 90

      # On a version tag (e.g. v2.0.0), publish a GitHub release with the APK.
      # Add docs/release-notes/<tag>.md before pushing the tag; it becomes the notes.
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: iPANTAU ${{ github.ref_name }}
          body_path: docs/release-notes/${{ github.ref_name }}.md
          files: build/app/outputs/flutter-apk/app-release.apk
          make_latest: true
